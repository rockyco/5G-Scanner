<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .host-box { fill: #e1f5ff; stroke: #036; stroke-width: 2; }
      .hw-box { fill: #ffe1e1; stroke: #600; stroke-width: 2; }
      .net-box { fill: #e1ffe1; stroke: #063; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .title { font-size: 14px; font-weight: bold; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .bidirectional { stroke: #666; stroke-width: 2; marker-start: url(#arrowhead-start); marker-end: url(#arrowhead); }
      .data-flow { stroke: #0066cc; stroke-width: 2; marker-end: url(#arrowhead-blue); stroke-dasharray: 3,3; }
      .control-flow { stroke: #cc6600; stroke-width: 2; marker-end: url(#arrowhead-orange); }
      .signal-flow { stroke: #009900; stroke-width: 3; marker-end: url(#arrowhead-green); }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#666" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc6600" />
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#009900" />
    </marker>
  </defs>
  
  <!-- Host Computer Section -->
  <rect x="20" y="20" width="300" height="200" class="host-box" rx="10" />
  <text x="170" y="40" class="text title">Host Computer</text>
  
  <!-- Web UI -->
  <rect x="40" y="60" width="80" height="30" fill="white" stroke="#036" rx="5" />
  <text x="80" y="80" class="text">Web UI</text>
  
  <!-- REST API -->
  <rect x="140" y="60" width="80" height="30" fill="white" stroke="#036" rx="5" />
  <text x="180" y="80" class="text">REST API</text>
  
  <!-- Config Manager -->
  <rect x="40" y="110" width="80" height="30" fill="white" stroke="#036" rx="5" />
  <text x="80" y="130" class="text">config.py</text>
  
  <!-- GSCN Calculator -->
  <rect x="140" y="110" width="80" height="30" fill="white" stroke="#036" rx="5" />
  <text x="180" y="130" class="text">gscn_calculator.py</text>
  
  <!-- USRP Controller -->
  <rect x="90" y="160" width="100" height="30" fill="white" stroke="#036" rx="5" />
  <text x="140" y="180" class="text">usrp_controller.py</text>
  
  <!-- USRP X310 Hardware Section -->
  <rect x="370" y="20" width="220" height="200" class="hw-box" rx="10" />
  <text x="480" y="40" class="text title">NI USRP X310 Hardware</text>
  
  <!-- FPGA -->
  <rect x="390" y="60" width="80" height="30" fill="white" stroke="#600" rx="5" />
  <text x="430" y="80" class="text">FPGA Bitstream</text>
  
  <!-- RFNoC -->
  <rect x="490" y="60" width="80" height="30" fill="white" stroke="#600" rx="5" />
  <text x="530" y="80" class="text">RFNoC SSB</text>
  
  <!-- ADC/DAC -->
  <rect x="390" y="120" width="80" height="30" fill="white" stroke="#600" rx="5" />
  <text x="430" y="140" class="text">ADC/DAC</text>
  
  <!-- Antenna -->
  <rect x="490" y="120" width="80" height="30" fill="white" stroke="#600" rx="5" />
  <text x="530" y="140" class="text">Antenna</text>
  
  <!-- 5G Network Section -->
  <rect x="620" y="20" width="200" height="200" class="net-box" rx="10" />
  <text x="720" y="40" class="text title">5G Network Environment</text>
  
  <!-- SSB Signals -->
  <ellipse cx="670" cy="90" rx="50" ry="25" fill="white" stroke="#063" stroke-width="2" />
  <text x="670" y="95" class="text">SSB Signals</text>
  <text x="670" y="105" class="text" style="font-size: 9px;">(n1/n3/n77/n78/n79)</text>
  
  <!-- gNodeB -->
  <rect x="670" y="140" width="100" height="40" fill="white" stroke="#063" rx="5" />
  <text x="720" y="160" class="text">5G gNodeB</text>
  <text x="720" y="170" class="text" style="font-size: 9px;">(Base Station)</text>
  
  <!-- Data Storage -->
  <rect x="40" y="250" width="280" height="120" class="host-box" rx="10" />
  <text x="180" y="270" class="text title">Data Storage & Configuration</text>
  
  <ellipse cx="90" cy="310" rx="40" ry="25" fill="white" stroke="#036" />
  <text x="90" y="315" class="text">config.json</text>
  
  <ellipse cx="180" cy="310" rx="40" ry="25" fill="white" stroke="#036" />
  <text x="180" y="315" class="text">*.dat files</text>
  
  <ellipse cx="270" cy="310" rx="45" ry="25" fill="white" stroke="#036" />
  <text x="270" y="315" class="text">detected_freq.json</text>
  
  <!-- CORRECTED ARROWS WITH PROPER DIRECTIONS -->
  
  <!-- 1. User Interface: Bidirectional communication between UI and API -->
  <line x1="120" y1="75" x2="140" y2="75" class="bidirectional" />
  <text x="130" y="70" class="text" style="font-size: 9px;">HTTP</text>
  
  <!-- 2. API to Core Components: Control flow from API -->
  <line x1="160" y1="90" x2="100" y2="110" class="control-flow" />
  <line x1="180" y1="90" x2="180" y2="110" class="control-flow" />
  <line x1="200" y1="90" x2="140" y2="160" class="control-flow" />
  
  <!-- 3. Config Manager to Data Storage: Bidirectional data access -->
  <line x1="80" y1="140" x2="90" y2="285" class="data-flow" />
  
  <!-- 4. USRP Controller to Hardware: Control commands -->
  <line x1="190" y1="175" x2="370" y2="100" class="control-flow" />
  <text x="280" y="135" class="text" style="font-size: 9px;">Control Commands</text>
  
  <!-- 5. USRP Controller to Data Storage: Save results and data -->
  <line x1="120" y1="190" x2="180" y2="285" class="data-flow" />
  <line x1="160" y1="190" x2="270" y2="285" class="data-flow" />
  
  <!-- 6. Hardware Internal Flow: Processing pipeline -->
  <line x1="470" y1="75" x2="490" y2="75" class="arrow" />
  <line x1="530" y1="90" x2="530" y2="120" class="arrow" />
  <line x1="470" y1="135" x2="490" y2="135" class="arrow" />
  
  <!-- 7. Antenna to 5G Network: RF Signal Flow (bidirectional) -->
  <line x1="570" y1="135" x2="620" y2="100" class="signal-flow" />
  <text x="595" y="115" class="text" style="font-size: 9px;">RF Signals</text>
  
  <!-- 8. SSB to gNodeB: Network communication (bidirectional) -->
  <line x1="690" y1="115" x2="720" y2="140" class="signal-flow" />
  
  <!-- 9. Hardware to Controller: Data feedback -->
  <line x1="370" y1="120" x2="190" y2="165" class="data-flow" />
  <text x="280" y="155" class="text" style="font-size: 9px;">Detection Results</text>
  
  <!-- Legend -->
  <rect x="400" y="280" width="420" height="120" fill="#f8f9fa" stroke="#ddd" stroke-width="1" rx="5" />
  <text x="610" y="300" class="text title">Data Flow Legend</text>
  
  <!-- Legend items -->
  <line x1="420" y1="320" x2="460" y2="320" class="control-flow" />
  <text x="470" y="325" class="text">Control Commands</text>
  
  <line x1="420" y1="340" x2="460" y2="340" class="data-flow" />
  <text x="470" y="345" class="text">Data Storage/Retrieval</text>
  
  <line x1="420" y1="360" x2="460" y2="360" class="signal-flow" />
  <text x="470" y="365" class="text">RF Signal Flow</text>
  
  <line x1="420" y1="380" x2="460" y2="380" class="bidirectional" />
  <text x="470" y="385" class="text">Bidirectional Communication</text>
  
  <rect x="580" y="310" width="20" height="15" class="host-box" />
  <text x="610" y="322" class="text">Host Software</text>
  
  <rect x="580" y="330" width="20" height="15" class="hw-box" />
  <text x="610" y="342" class="text">USRP Hardware</text>
  
  <rect x="580" y="350" width="20" height="15" class="net-box" />
  <text x="610" y="362" class="text">5G Network</text>
  
  <!-- Flow direction indicators -->
  <text x="420" y="420" class="text" style="font-size: 10px; font-weight: bold;">Flow Direction:</text>
  <text x="420" y="435" class="text" style="font-size: 9px;">User → UI → API → Components → Hardware → 5G Network</text>
  <text x="420" y="450" class="text" style="font-size: 9px;">Results: Hardware → Controller → Data Storage ← API ← UI ← User</text>
</svg>
